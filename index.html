<!DOCTYPE html>
<html lang="tr">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Mirai Blogs</title>

    <style>

        body {
            margin: 0;
            min-height: 100vh;

            background-image: url("indir.jfif");
            background-size: cover;
            background-position: center;
            background-attachment: fixed;

            font-family: Arial, sans-serif;
            color: #5c2945;
        }

        /* ÜST BAŞLIK */

        header {
            text-align: center;
            padding: 35px 20px 15px;
        }

        header h1 {
            font-size: 60px;
            margin: 0;

            text-shadow: 3px 3px white;
        }

        /* MENÜ */

        nav {
            text-align: center;
            margin: 20px;
        }

        nav a {
            display: inline-block;

            background: rgba(255, 255, 255, 0.8);

            color: #5c2945;
            text-decoration: none;

            padding: 12px 20px;
            margin: 5px;

            border-radius: 15px;

            border: 2px solid #5c2945;

            font-weight: bold;
        }

        nav a:hover {
            background: #f3b6d2;
            transform: scale(1.05);
        }

        /* ANA KUTU */

        .welcome {
            width: 70%;
            max-width: 800px;

            margin: 70px auto;

            background: rgba(255, 255, 255, 0.75);

            padding: 40px;

            border-radius: 30px;

            text-align: center;

            backdrop-filter: blur(5px);

            box-shadow: 0 10px 30px rgba(0,0,0,0.2);
        }

        .welcome h2 {
            font-size: 40px;
        }

        .welcome p {
            font-size: 20px;
            line-height: 1.6;
        }

        /* BUTON */

        button {
            background: white;

            border: 2px solid #5c2945;

            border-radius: 15px;

            padding: 12px 25px;

            font-size: 18px;

            cursor: pointer;
        }

        button:hover {
            background: #b6f3d7;
        }

    </style>

</head>


<body>

    <header>

        <h1>MIRAI BLOGS</h1>

    </header>


    <nav>

        <a href="music.html">MUSIC</a>

        <a href="art.html">ART</a>

        <a href="friends.html">FRIENDS</a>

        <a href="games.html">GAMES</a>

        <a href="about.html">ABOUT</a>

    </nav>


    <main>

        <section class="welcome">

            <h2>♡ BLOG SİTEME HOŞ GELDİNİZ ♡</h2>

            <p>
                Geleceğin blog, yazı ve düşünceleri
                tam olarak burada! XD
            </p>

           <img src="indir.fa.jpeg" class="start-button">

        </section>

    </main>


</body>

</html>
