<!DOCTYPE html>
<html lang="tr">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>♡ Mirai Music ♡</title>

    <style>

        * {
            box-sizing: border-box;
        }

        html,
        body {
            margin: 0;
            padding: 0;
            min-height: 100%;
        }

        body {
            font-family: Arial, Helvetica, sans-serif;
            overflow-x: hidden;

            background:
                linear-gradient(
                    180deg,
                    #00AEEF 0%,
                    #08CFF0 30%,
                    #42E4C1 58%,
                    #42D35C 82%,
                    #159C43 100%
                );

            color: #14556B;
        }


        /* =========================================
           ANA SAYFA
        ========================================= */

        .music-page {
            position: relative;
            min-height: 100vh;
            overflow: hidden;

            padding: 35px 25px 55px;
        }


        /* =========================================
           GÜNEŞ IŞIĞI
        ========================================= */

        .sun-glow {
            position: absolute;

            width: 430px;
            height: 430px;

            top: -180px;
            right: -100px;

            border-radius: 50%;

            background:
                radial-gradient(
                    circle,
                    rgba(255,255,210,0.9) 0%,
                    rgba(255,255,170,0.45) 30%,
                    rgba(255,255,255,0) 70%
                );

            pointer-events: none;
        }


        /* =========================================
           BULUTLAR
        ========================================= */

        .cloud {
            position: absolute;

            width: 220px;
            height: 58px;

            background: rgba(255,255,255,0.88);

            border-radius: 100px;

            filter: blur(0.4px);

            box-shadow:
                0 8px 18px rgba(0,120,170,0.15);

            animation: cloudMove 18s linear infinite;
        }

        .cloud::before,
        .cloud::after {
            content: "";

            position: absolute;

            background: inherit;

            border-radius: 50%;
        }

        .cloud::before {
            width: 90px;
            height: 90px;

            left: 30px;
            bottom: 12px;
        }

        .cloud::after {
            width: 105px;
            height: 105px;

            right: 30px;
            bottom: 4px;
        }

        .cloud-one {
            left: -40px;
            top: 70px;
        }

        .cloud-two {
            width: 170px;
            height: 45px;

            right: -20px;
            top: 170px;

            opacity: 0.7;

            animation-duration: 25s;
            animation-direction: reverse;
        }

        @keyframes cloudMove {

            0% {
                transform: translateX(-30px);
            }

            50% {
                transform: translateX(50px);
            }

            100% {
                transform: translateX(-30px);
            }
        }


        /* =========================================
           BALONCUKLAR
        ========================================= */

        .bubble {
            position: absolute;

            border-radius: 50%;

            background:
                radial-gradient(
                    circle at 30% 25%,
                    rgba(255,255,255,1),
                    rgba(255,255,255,0.35) 28%,
                    rgba(50,220,245,0.35) 65%,
                    rgba(0,150,210,0.15)
                );

            border: 2px solid rgba(255,255,255,0.8);

            box-shadow:
                inset -5px -7px 10px rgba(0,120,170,0.15),
                0 3px 12px rgba(0,130,170,0.18);

            animation: bubbleFloat 6s ease-in-out infinite;
        }

        .bubble-one {
            width: 35px;
            height: 35px;

            left: 5%;
            top: 55%;

            animation-delay: 1s;
        }

        .bubble-two {
            width: 20px;
            height: 20px;

            left: 12%;
            top: 70%;

            animation-delay: 2s;
        }

        .bubble-three {
            width: 45px;
            height: 45px;

            right: 7%;
            top: 43%;

            animation-delay: 3s;
        }

        .bubble-four {
            width: 16px;
            height: 16px;

            right: 18%;
            bottom: 12%;

            animation-delay: 4s;
        }

        @keyframes bubbleFloat {

            0%,
            100% {
                transform: translateY(0) translateX(0);
            }

            50% {
                transform: translateY(-35px) translateX(12px);
            }
        }


        /* =========================================
           YÜZEN BALIK
        ========================================= */

        .fish {
            position: absolute;

            left: -150px;
            top: 38%;

            font-size: 65px;

            z-index: 2;

            animation:
                fishSwim 22s linear infinite,
                fishBob 3s ease-in-out infinite;
        }

        @keyframes fishSwim {

            0% {
                left: -150px;
                transform: scaleX(1);
            }

            49% {
                left: 105%;
                transform: scaleX(1);
            }

            50% {
                left: 105%;
                transform: scaleX(-1);
            }

            100% {
                left: -150px;
                transform: scaleX(-1);
            }
        }

        @keyframes fishBob {

            0%,
            100% {
                margin-top: 0;
            }

            50% {
                margin-top: -15px;
            }
        }


        /* =========================================
           BALIK BALONCUKLARI
        ========================================= */

        .fish-bubbles {
            position: absolute;

            left: -30px;
            top: -25px;

            font-size: 15px;

            animation: fishBubble 3s ease-out infinite;
        }

        @keyframes fishBubble {

            0% {
                transform: translate(0,0);
                opacity: 0;
            }

            25% {
                opacity: 1;
            }

            100% {
                transform: translate(-25px,-55px);
                opacity: 0;
            }
        }


        /* =========================================
           BAŞLIK
        ========================================= */

        .music-header {
            position: relative;

            text-align: center;

            z-index: 10;

            margin-bottom: 28px;
        }

        .music-header h1 {
            margin: 0;

            color: white;

            font-size: 48px;

            letter-spacing: 5px;

            text-shadow:
                0 4px 0 #0788B8,
                0 7px 12px rgba(0,90,130,0.35);
        }

        .music-header p {
            margin: 8px 0;

            color: white;

            font-size: 15px;

            font-weight: bold;

            text-shadow:
                0 2px 4px rgba(0,90,120,0.35);
        }

        .music-stars {
            color: #FFFBC4;

            font-size: 21px;

            letter-spacing: 9px;

            text-shadow:
                0 0 9px white;
        }


        /* =========================================
           ANA PANEL
        ========================================= */

        .music-container {
            position: relative;

            width: min(1100px, 94%);

            margin: auto;

            padding: 30px;

            border-radius: 32px;

            background:
                linear-gradient(
                    145deg,
                    rgba(255,255,255,0.90),
                    rgba(218,250,255,0.72)
                );

            border: 4px solid rgba(255,255,255,0.9);

            box-shadow:
                0 15px 35px rgba(0,90,120,0.25),
                inset 0 4px 8px rgba(255,255,255,0.95);

            backdrop-filter: blur(8px);

            z-index: 5;
        }


        /* =========================================
           BAŞLIK
        ========================================= */

        .section-title {
            text-align: center;

            margin: 0 0 25px;

            color: #0877A0;

            font-size: 24px;

            text-shadow:
                0 2px white;
        }

        .section-title span {
            color: #19A84B;

            margin: 0 10px;
        }


        /* =========================================
           ALBÜM KARTI
        ========================================= */

        .album-card {
            display: flex;

            gap: 25px;

            padding: 23px;

            border-radius: 25px;

            background:
                linear-gradient(
                    135deg,
                    rgba(255,255,255,0.96),
                    rgba(216,248,244,0.88)
                );

            border: 3px solid white;

            box-shadow:
                0 9px 20px rgba(0,110,130,0.20),
                inset 0 3px 5px rgba(255,255,255,1);

            position: relative;

            overflow: hidden;
        }

        .album-card::before {
            content: "";

            position: absolute;

            width: 300px;
            height: 300px;

            right: -180px;
            top: -180px;

            border-radius: 50%;

            background:
                radial-gradient(
                    circle,
                    rgba(255,255,255,0.95),
                    rgba(255,255,255,0)
                );
        }


        /* =========================================
           ALBÜM KAPAĞI
        ========================================= */

        .album-cover {
            width: 200px;
            height: 200px;

            flex-shrink: 0;

            object-fit: cover;

            border-radius: 20px;

            border: 5px solid white;

            background:
                linear-gradient(
                    135deg,
                    #08BDE8,
                    #45D85F
                );

            box-shadow:
                0 8px 18px rgba(0,90,120,0.28);
        }


        /* =========================================
           ALBÜM BİLGİLERİ
        ========================================= */

        .album-info {
            flex: 1;

            position: relative;

            z-index: 2;
        }

        .album-info h2 {
            margin: 0;

            color: #08729A;

            font-size: 32px;
        }

        .artist {
            margin: 5px 0 15px;

            color: #159447;

            font-size: 17px;

            font-weight: bold;
        }


        /* =========================================
           ŞARKILAR
        ========================================= */

        .track-box {
            max-height: 250px;

            overflow-y: auto;

            padding: 13px 18px;

            border-radius: 17px;

            background:
                linear-gradient(
                    180deg,
                    #D9F9FF,
                    #C8F4D7
                );

            border: 2px solid white;

            box-shadow:
                inset 0 3px 7px rgba(0,100,130,0.10);
        }

        .track-box h3 {
            margin: 0 0 7px;

            color: #08779D;

            font-size: 14px;
        }

        .track-box ol {
            margin: 0;

            padding-left: 26px;

            color: #286775;

            line-height: 1.75;

            font-size: 14px;
        }

        .track-box li::marker {
            color: #16A94A;

            font-weight: bold;
        }


        /* =========================================
           FAVORİ ŞARKI
        ========================================= */

        .favorite {
            display: inline-flex;

            align-items: center;

            gap: 10px;

            margin-top: 15px;

            padding: 10px 16px;

            border-radius: 16px;

            background:
                linear-gradient(
                    135deg,
                    #FFD7EE,
                    #D5F8FF
                );

            border: 2px solid white;

            box-shadow:
                0 5px 12px rgba(100,100,140,0.15);
        }

        .favorite-icon {
            font-size: 23px;

            color: #E25B9E;
        }

        .favorite small {
            display: block;

            color: #62848B;

            font-size: 9px;

            letter-spacing: 1px;
        }

        .favorite strong {
            display: block;

            color: #9A4380;

            font-size: 15px;
        }


        /* =========================================
           RETRO MP3 ÇALAR
        ========================================= */

        .mp3-player {
            position: fixed;

            right: 22px;
            bottom: 22px;

            width: 205px;

            padding: 15px;

            border-radius: 22px;

            background:
                linear-gradient(
                    145deg,
                    #B9F4FF,
                    #76D9EF
                );

            border: 3px solid white;

            box-shadow:
                0 8px 20px rgba(0,90,120,0.30),
                inset 0 3px 5px white;

            z-index: 20;
        }

        .mp3-top {
            display: flex;

            justify-content: space-between;

            color: #08729A;

            font-size: 11px;

            font-weight: bold;
        }

        .mp3-screen {
            margin: 10px 0;

            padding: 9px;

            border-radius: 10px;

            background:
                linear-gradient(
                    180deg,
                    #D9FFF0,
                    #A8EED0
                );

            border: 2px solid rgba(255,255,255,0.9);

            color: #24735B;

            font-family: monospace;

            font-size: 11px;

            overflow: hidden;
        }

        .mp3-song {
            white-space: nowrap;

            animation: songScroll 6s linear infinite;
        }

        @keyframes songScroll {

            0% {
                transform: translateX(0);
            }

            100% {
                transform: translateX(-35px);
            }
        }

        .progress {
            height: 7px;

            margin: 9px 0;

            border-radius: 10px;

            background: rgba(255,255,255,0.7);

            overflow: hidden;
        }

        .progress-bar {
            width: 58%;

            height: 100%;

            border-radius: 10px;

            background:
                linear-gradient(
                    90deg,
                    #12AEE8,
                    #25C94F
                );

            animation: progressMove 8s linear infinite;
        }

        @keyframes progressMove {

            0% {
                width: 5%;
            }

            100% {
                width: 95%;
            }
        }

        .mp3-controls {
            display: flex;

            justify-content: center;

            gap: 8px;
        }

        .mp3-controls button {
            width: 30px;
            height: 27px;

            border: 2px solid white;

            border-radius: 9px;

            background: #EFFFFF;

            color: #08779A;

            font-weight: bold;

            cursor: pointer;
        }


        /* =========================================
           SAYFA BUTONLARI
        ========================================= */

        .music-navigation {
            display: flex;

            align-items: center;

            justify-content: center;

            gap: 25px;

            margin-top: 28px;
        }

        .music-button {
            padding: 11px 21px;

            border: 3px solid white;

            border-radius: 18px;

            background:
                linear-gradient(
                    180deg,
                    white,
                    #B8F0F4
                );

            color: #08759A;

            font-weight: bold;

            cursor: pointer;

            box-shadow:
                0 5px 12px rgba(0,100,130,0.20);

            transition: 0.2s;
        }

        .music-button:hover {
            transform: translateY(-3px);

            background:
                linear-gradient(
                    180deg,
                    white,
                    #B5F0C9
                );
        }

        .page-number {
            color: white;

            text-align: center;

            font-weight: bold;

            text-shadow:
                0 2px 5px rgba(0,90,120,0.5);
        }

        .page-number small {
            display: block;

            font-size: 9px;

            letter-spacing: 2px;
        }

        .page-number strong {
            font-size: 19px;
        }


        /* =========================================
           ALT DOĞA
        ========================================= */

        .grass {
            position: absolute;

            bottom: 0;
            left: 0;

            width: 100%;
            height: 55px;

            background:
                linear-gradient(
                    180deg,
                    transparent,
                    rgba(10,140,55,0.65)
                );

            pointer-events: none;
        }


        /* =========================================
           TELEFON
        ========================================= */

        @media (max-width: 750px) {

            .music-page {
                padding: 25px 12px 160px;
            }

            .music-header h1 {
                font-size: 33px;
            }

            .music-container {
                width: 100%;

                padding: 17px;
            }

            .album-card {
                flex-direction: column;

                align-items: center;

                text-align: center;
            }

            .album-cover {
                width: 175px;
                height: 175px;
            }

            .track-box {
                text-align: left;
            }

            .mp3-player {
                width: 180px;

                right: 10px;
                bottom: 10px;
            }

            .music-navigation {
                gap: 10px;
            }

            .music-button {
                padding: 9px 12px;

                font-size: 11px;
            }
        }

    </style>
</head>


<body>

    <div class="music-page">

        <div class="sun-glow"></div>

        <!-- BULUTLAR -->

        <div class="cloud cloud-one"></div>
        <div class="cloud cloud-two"></div>


        <!-- BALONCUKLAR -->

        <div class="bubble bubble-one"></div>
        <div class="bubble bubble-two"></div>
        <div class="bubble bubble-three"></div>
        <div class="bubble bubble-four"></div>


        <!-- YÜZEN BALIK -->

        <div class="fish">

            🐠

            <div class="fish-bubbles">
                ○
                ○
                ●
            </div>

        </div>


        <!-- BAŞLIK -->

        <header class="music-header">

            <h1>♡ MÜZİK ♡</h1>

            <p>
                En sevdiğim albümler, şarkılar ve müzikler
            </p>

            <div class="music-stars">
                ✦ ✧ ♪ ✧ ✦
            </div>

        </header>


        <!-- ANA ALAN -->

        <main class="music-container">

            <h2 class="section-title">

                <span>♪</span>

                EN SEVDİĞİM ALBÜMLER

                <span>♫</span>

            </h2>


            <!-- ALBÜM -->
