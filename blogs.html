<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <title>Mirai Blogs</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            background: #7FDBFF;
            font-family: Arial, sans-serif;
        }

        /* WINDOWS MEDIA PLAYER FOTOĞRAFI */
        .player {
            position: relative;
            width: 95vw;
            max-width: 1200px;
            aspect-ratio: 1536 / 1214;
            margin: 30px auto;
            background-image: url("blog-background.jpg");
            background-size: 100% 100%;
            background-repeat: no-repeat;
        }

        /* SOL MAVİ ALAN */
        .categories {
            position: absolute;

            left: 1.2%;
            top: 30%;
            width: 12.5%;
            height: 62%;

            overflow-y: auto;
            overflow-x: hidden;

            padding: 10px;
        }

        /* KATEGORİ BUTONLARI */
        .category {
            display: block;
            width: 100%;

            margin-bottom: 12px;
            padding: 9px 5px;

            border: none;
            background: transparent;

            color: white;
            font-size: 16px;
            font-weight: bold;

            text-align: left;
            cursor: pointer;
        }

        .category:hover {
            color: #FFD83D;
        }

        /* ORTADAKİ BEYAZ ALAN */
        .blog-content {
            position: absolute;

            left: 13.8%;
            top: 14.5%;

            width: 75%;
            height: 61%;

            padding: 35px;

            overflow-y: auto;

            background: rgba(255, 255, 255, 0.94);
        }

        .blog-content h1 {
            color: #0066CC;
        }

        .blog-content p {
            color: #315A63;
            font-size: 17px;
            line-height: 1.7;
        }

    </style>
</head>

<body>

<div class="player">

    <!-- SOLDAKİ KATEGORİLER -->
    <div class="categories">

        <button class="category" onclick="showBlog('diziler')">
            DİZİLER
        </button>

        <button class="category" onclick="showBlog('muzik')">
            MÜZİK
        </button>

        <button class="category" onclick="showBlog('oyunlar')">
            OYUNLAR
        </button>

        <button class="category" onclick="showBlog('sanat')">
            SANAT
        </button>

        <button class="category" onclick="showBlog('anime')">
            ANİME
        </button>

        <button class="category" onclick="showBlog('filmler')">
            FİLMLER
        </button>

        <button class="category" onclick="showBlog('kitaplar')">
            KİTAPLAR
        </button>

        <button class="category" onclick="showBlog('teknoloji')">
            TEKNOLOJİ
        </button>

        <button class="category" onclick="showBlog('random')">
            RANDOM
        </button>

    </div>


    <!-- BEYAZ BLOG ALANI -->
    <div class="blog-content" id="blog-content">

        <h1>♡ MIRAI BLOGS ♡</h1>

        <p>
            Soldaki kategorilerden birini seç!
        </p>

        <p>
            Seçtiğin blog yazısı burada görünecek.
        </p>

    </div>

</div>


<script>

function showBlog(blog) {

    const content = document.getElementById("blog-content");

    if (blog === "diziler") {

        content.innerHTML = `
            <h1>📺 DİZİLER</h1>
            <p>
                Diziler hakkındaki blog yazılarım burada olacak.
            </p>
        `;

    } else if (blog === "muzik") {

        content.innerHTML = `
            <h1>🎵 MÜZİK</h1>
            <p>
                Müzik hakkındaki yazılarım burada olacak.
            </p>
        `;

    } else if (blog === "oyunlar") {

        content.innerHTML = `
            <h1>🎮 OYUNLAR</h1>
            <p>
                Oyunlar hakkındaki yazılarım burada olacak.
            </p>
        `;

    } else if (blog === "sanat") {

        content.innerHTML = `
            <h1>🎨 SANAT</h1>
            <p>
                Sanat hakkındaki yazılarım burada olacak.
            </p>
        `;

    } else if (blog === "anime") {

        content.innerHTML = `
            <h1>🌸 ANİME</h1>
            <p>
                Anime hakkındaki yazılarım burada olacak.
            </p>
        `;

    } else if (blog === "filmler") {

        content.innerHTML = `
            <h1>🎬 FİLMLER</h1>
            <p>
                Filmler hakkındaki yazılarım burada olacak.
            </p>
        `;

    } else if (blog === "kitaplar") {

        content.innerHTML = `
            <h1>📚 KİTAPLAR</h1>
            <p>
                Kitaplar hakkındaki yazılarım burada olacak.
            </p>
        `;

    } else if (blog === "teknoloji") {

        content.innerHTML = `
            <h1>💻 TEKNOLOJİ</h1>
            <p>
                Teknoloji hakkındaki yazılarım burada olacak.
            </p>
        `;

    } else if (blog === "random") {

        content.innerHTML = `
            <h1>💭 RANDOM</h1>
            <p>
                Aklıma gelen çeşitli şeyler burada olacak.
            </p>
        `;
    }

}

</script>

</body>
</html>
